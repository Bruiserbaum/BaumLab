version: "3.9"

services:
  api:
    build: ./backend
    # Always rebuild on `up` so a Portainer Git redeploy (Settings → Updates) picks up new code
    pull_policy: build
    container_name: baumlab-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8100}:8000"
      - "${SYSLOG_PORT:-514}:514/udp"   # Syslog receiver (UDP)
    volumes:
      # Portainer Git stacks: set these to absolute host paths — Portainer CE resolves
      # relative paths inside its own compose folder, not your clone
      - ${BAUMLAB_DATA_PATH:-./data}:/app/data          # SQLite database + persistent state
      - ${BAUMLAB_CONFIG_PATH:-./config}:/app/config    # User config (credentials, scan ranges, etc.)
      - gvmd-socket:/var/run/gvmd # Shared gvmd Unix socket from OpenVAS
      # Backups: Docker access to stop/start containers, archive volumes and dump databases.
      # This gives BaumLab root-equivalent control of the host (as does the Portainer key).
      - /var/run/docker.sock:/var/run/docker.sock
      # Backup scratch space — must be the SAME path on both sides: helper containers that
      # archive volumes are created by the host's Docker daemon and mount this host path
      - /tmp/baumlab-backup:/tmp/baumlab-backup
    # Set these in Portainer → Stack → Environment Variables (or in a local .env file)
    # Required: SECRET_KEY, ADMIN_PASSWORD
    # Optional: ADMIN_USERNAME (default: admin), TOKEN_EXPIRE_HOURS (default: 8)
    #           API_PORT (default: 8100), UI_PORT (default: 3100)
    #           SYSLOG_PORT (default: 514) — UDP port to receive syslog from NAS/devices
    environment:
      - DATABASE_URL=sqlite:///./data/baumlab.db
      - CONFIG_PATH=/app/config/config.yaml
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TOKEN_EXPIRE_HOURS=${TOKEN_EXPIRE_HOURS:-8}
      # Time zone for backup cron schedules (e.g. America/New_York)
      - TZ=${TZ:-UTC}
      - BACKUP_TMP_DIR=/tmp/baumlab-backup
      # Authentik forward auth (NPM header-based auto-login) — see BaumDocker/authentik/README
      - AUTHENTIK_HEADER_AUTH=${AUTHENTIK_HEADER_AUTH:-false}
      # Shared secret NPM sends as X-BaumLab-Proxy-Secret — required for the vault when header auth is on
      - AUTHENTIK_PROXY_SECRET=${AUTHENTIK_PROXY_SECRET:-}
      # Credential vault encryption key (falls back to SECRET_KEY). Back it up — losing it loses the vault.
      - VAULT_KEY=${VAULT_KEY:-}
      # Authentik SSO (OIDC) — uncomment and fill in .env to enable
      # - OIDC_ENABLED=${OIDC_ENABLED:-false}
      # - OIDC_ISSUER=${OIDC_ISSUER}
      # - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      # - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      # - OIDC_FRONTEND_URL=${OIDC_FRONTEND_URL}
    networks:
      - baumlab
    depends_on:
      - openvas
    # HOST networking required for raw ICMP ping and ARP scanning
    # Swap to the line below if you want ping/ARP to see your LAN:
    # network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

  frontend:
    build: ./frontend
    pull_policy: build
    container_name: baumlab-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3100}:80"
    depends_on:
      - api
    networks:
      - baumlab

  # ---------------------------------------------------------------------------
  # Greenbone Community Edition / OpenVAS
  # Powered by OpenVAS — https://www.openvas.org/
  # Greenbone Community Edition — https://github.com/greenbone/
  # ---------------------------------------------------------------------------
  # NOTE: First startup takes 15-60 minutes to sync the NVT/SCAP/CERT feed data.
  # The gvmd Unix socket is shared with the api container via the gvmd-socket volume.
  # Default admin credentials are set via OPENVAS_ADMIN_PASSWORD below.
  # ---------------------------------------------------------------------------
  openvas:
    # Pinned on purpose: "latest" once jumped PostgreSQL 13 → 15 and the image couldn't migrate the
    # existing database. Change this tag deliberately (and back up openvas-data first) to upgrade.
    image: immauss/openvas:26.07.27.01
    container_name: baumlab-openvas
    restart: unless-stopped
    hostname: openvas
    volumes:
      - openvas-data:/data              # NVT feeds, SCAP/CERT data, scan results
      - gvmd-socket:/var/run/gvmd       # Unix socket shared with api container
    environment:
      - USERNAME=${OPENVAS_ADMIN_USERNAME:-admin}
      - PASSWORD=${OPENVAS_ADMIN_PASSWORD:-changeme}
    # No published ports: BaumLab talks to gvmd over the shared Unix socket (gvmd-socket volume);
    # this image does not listen for GMP on TCP 9390, so leave Host blank in Settings.
    # To open Greenbone's own web UI on your LAN, add:  ports: ["9392:9392"]
    networks:
      - baumlab

volumes:
  openvas-data:    # Persistent NVT/SCAP/CERT feed data and scan results
  gvmd-socket:     # Ephemeral shared volume for gvmd Unix socket

networks:
  baumlab:
    driver: bridge
