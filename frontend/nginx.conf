# WebSocket upgrade for the web terminal (/api/terminal/ws/…)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the page itself so a redeploy is picked up on the next load…
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # …while Vite's content-hashed bundles can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Terminal sessions are long-lived; the backend closes idle ones itself
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Forward Authentik identity headers injected by NPM forward auth
        proxy_set_header X-authentik-username $http_x_authentik_username;
        proxy_set_header X-authentik-groups   $http_x_authentik_groups;
        proxy_set_header X-authentik-email    $http_x_authentik_email;
        # Shared secret NPM adds to prove the Authentik headers are genuine (AUTHENTIK_PROXY_SECRET)
        proxy_set_header X-BaumLab-Proxy-Secret $http_x_baumlab_proxy_secret;
    }
}
